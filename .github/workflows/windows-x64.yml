name: Windows x64 Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/vpx-10.8.1-layout-windows-x64
  pull_request:
    paths:
      - VPXmerge.py
      - .github/workflows/windows-x64.yml

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64 executable
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install 64-bit Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt

      - name: Verify Python source compiles
        shell: pwsh
        run: python -m py_compile VPXmerge.py serum_lookup.py

      - name: Run Serum regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name VPXmerge_10_8_1 --collect-all tkinterdnd2 VPXmerge.py
          if (-not (Test-Path "dist/VPXmerge_10_8_1/VPXmerge_10_8_1.exe")) {
            throw "Windows executable not created"
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/VPXmerge_10_8_1/*" -DestinationPath "dist/VPXmerge_10_8_1-Windows-x64.zip" -Force

      - name: Upload downloadable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: VPXmerge-10.8.1-Windows-x64
          path: dist/VPXmerge_10_8_1-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
